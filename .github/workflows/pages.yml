name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fL "$base/$editor" -o "$RUNNER_TEMP/$editor"
          curl -fL "$base/$templates" -o "$RUNNER_TEMP/$templates"
          curl -fL "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          (cd "$RUNNER_TEMP" && grep -E " ($editor|$templates)$" SHA512-SUMS.txt | sha512sum --check --strict)
          unzip -q "$RUNNER_TEMP/$editor" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -q "$RUNNER_TEMP/$templates" -d "$RUNNER_TEMP/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "$RUNNER_TEMP/templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and test
        run: |
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script tests/test_game.gd
      - name: Export
        run: |
          release_dir="build/web/releases/${GITHUB_SHA}"
          mkdir -p "$release_dir"
          touch build/.gdignore
          godot --headless --path . --export-release Web "$release_dir/index.html"
          cp web/launcher.html build/web/index.html
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > build/web/release.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
