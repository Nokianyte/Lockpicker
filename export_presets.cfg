[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="charts/*.lockchart"
exclude_filter="tests/*,openspec/*,README.md,docs/*,test-results/*,tools/*,build/*,web/*"
export_path="build/web/index.html"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<link rel='icon' href='data:, '><style>html,body{overscroll-behavior:none;overflow:hidden;background:#f9f8f4!important;color:#252325}#status-progress{accent-color:#d8243d}</style><script>window.addEventListener('DOMContentLoaded',()=>{document.getElementById('canvas')?.addEventListener('wheel',e=>e.preventDefault(),{passive:false});});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
