[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,openspec/*,README.md,docs/*,test-results/*,tools/*,build/*"
export_path="build/web/index.html"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<link rel='icon' href='data:, '><style>html,body{overscroll-behavior:none;overflow:hidden;background:#06090f}</style><script>window.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('canvas');if(c){c.addEventListener('wheel',e=>e.preventDefault(),{passive:false});for(const type of ['mousedown','mouseup','auxclick'])c.addEventListener(type,e=>{if(e.button===1)e.preventDefault()},{passive:false});}});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false


